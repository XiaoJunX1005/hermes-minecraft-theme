# Base palette + CLI/TUI flavor. tools/build_skin.py adds banner_logo,
# banner_hero and customCSS, then writes skins/minecraft.yaml.
name: minecraft
description: "Voxel Lantern — original blocky pixel theme with a floating island, lantern pet & soft night palette"

colors:
  background: "#15171c"
  ui_accent: "#4fc3a8"
  banner_accent: "#4fc3a8"
  banner_title: "#f2b36b"
  banner_text: "#ece6da"
  ui_text: "#ece6da"
  ui_primary: "#f2b36b"
  ui_label: "#ece6da"
  banner_dim: "#9a958c"
  banner_border: "#2e323b"
  ui_border: "#2e323b"
  ui_tool: "#4fc3a8"
  ui_thinking: "#a99bd6"
  ui_ok: "#8fbf6a"
  ui_warn: "#f2b36b"
  ui_error: "#e46a6a"
  prompt: "#ece6da"
  input_rule: "#4fc3a8"
  response_border: "#f2b36b"
  status_bar_bg: "#111317"
  status_bar_text: "#d8d2c6"
  status_bar_strong: "#f2b36b"
  status_bar_dim: "#8a857c"
  status_bar_good: "#8fbf6a"
  status_bar_warn: "#f2b36b"
  status_bar_bad: "#e8935a"
  status_bar_critical: "#e46a6a"
  session_label: "#f2b36b"
  session_border: "#2e323b"
  syntax_string: "#8fbf6a"
  syntax_number: "#f2b36b"
  syntax_keyword: "#4fc3a8"
  syntax_comment: "#7d7a74"
  diff_added: "#8fbf6a"
  diff_removed: "#e46a6a"
  completion_menu_bg: "#1c1f25"
  completion_menu_current_bg: "#245c50"
  completion_menu_meta_bg: "#181a20"
  completion_menu_meta_current_bg: "#1d4a40"

spinner:
  waiting_faces: ["[·  ]", "[·· ]", "[···]", "[ ··]", "[  ·]"]
  thinking_faces: ["[▖]", "[▘]", "[▝]", "[▗]"]
  thinking_verbs:
    - lighting lanterns
    - stacking blocks
    - tending the moss
    - carving stone
    - mapping the island
    - polishing copper
    - planting saplings
    - reading the stars
  wings:
    - ["⟦▪", "▪⟧"]
    - ["⟦▫", "▫⟧"]

branding:
  agent_name: Hermes Agent
  welcome: "🏮 燈已點亮，歡迎回來"
  goodbye: "🏮 熄燈，下次見"
  response_label: " ▣ Hermes "
  prompt_symbol: "▸"
  help_header: "[▣] Commands"

tool_prefix: "┃"

tool_emojis:
  terminal: "⚒"
  web_search: "🧭"
  web_extract: "🗺"
  read_file: "📜"
  write_file: "🧱"
  patch: "🔧"
  search_files: "🔦"
