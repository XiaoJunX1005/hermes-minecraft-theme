<!doctype html>
<html><head><meta charset="utf-8"><title>Hermes Minecraft — font options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap">
<style>
@font-face{font-family:"Cubic 11";src:url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/web/Cubic_11.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Zpix Latin";src:url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font/website/zpix.woff2") format("woff2");unicode-range:U+0000-024F,U+2000-206F;font-display:swap}
@font-face{font-family:"Zpix";src:url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font/website/zpix.woff2") format("woff2");font-display:swap}
html,body{margin:0;background:#17191f;color:#e8e8e8}
body{padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:1180px}
.card{border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.12),inset -2px -2px 0 rgba(0,0,0,.5);background:#1d2027;padding:14px 18px}
.tag{font:600 13px "Segoe UI",sans-serif;color:#7bd34a;letter-spacing:.06em;margin-bottom:8px}
h2{margin:0 0 8px;font-size:24px;color:#ffaa00;text-shadow:2px 2px 0 #3f2a00;font-weight:400}
p{margin:4px 0;font-size:16px;line-height:1.55}
.num{font-size:18px;color:#55ffff}
code{font:14px Consolas,monospace;color:#7bd34a;background:#0008;border:1px solid #000;padding:1px 4px}
.A{font-family:"Pixelify Sans","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif}
.B{font-family:"Zpix Latin","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif}
.C{font-family:"Cubic 11","Microsoft JhengHei",sans-serif}
.D{font-family:"Zpix","Microsoft JhengHei",sans-serif}
.E{font-family:"Silkscreen","Cubic 11",sans-serif}
.small{font-size:13px;color:#a0a0a0}
</style></head><body>
<script>
const opts=[
 ["D","① minecraft（預設）— Zpix 全像素","中英數字都是 12px 點陣；數字 5/S、0/O 最好分"],
 ["C","② minecraft-cubic — 俐方體 11 號 全像素","筆畫較細、較圓潤，可愛感最強"],
 ["B","③ minecraft-mixed — 英數 Zpix + 中文正黑體","英文數字像素，中文維持平滑，長文最好讀"],
 ["A","④ minecraft-pixelify — Pixelify Sans（初版）","初版字型；注意 5 會像 S"],
];
for(const [k,t,d] of opts){document.write(`<div class="card ${k}"><div class="tag">${t}</div>
<h2>驗證結果 Crafting your theme</h2>
<p>主題已套用到你的 Hermes，寵物檢查顯示 ✓ ready。請打開 Gateway 確認畫面。</p>
<p class="num">Opus 5.5 · v0.22.5 · 0O 1Il 5S 8B · 31分 · 1小時</p>
<p>指令：<code>hermes config set display.skin minecraft</code></p>
<p class="small">${d}</p></div>`)}
</script>
</body></html>
